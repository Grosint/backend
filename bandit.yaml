# Bandit security scanner configuration
# Excludes external API code from security scanning

exclude_dirs:
  - tests
  - venv
  - .venv
  - __pycache__
  - htmlcov
  - logs
  - app/externals

skips:
  - B101  # assert_used
  - B601  # shell_injection_subprocess

